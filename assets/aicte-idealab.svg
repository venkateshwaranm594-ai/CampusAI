<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <!-- AICTE - IDEALab Logo -->
  <g transform="translate(10, 5)">
    <!-- Lightbulb graphic with gear/rays -->
    <circle cx="28" cy="28" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <path d="M 28,18 C 24,18 21,21 21,25 C 21,28 23,30 24,32 L 32,32 C 33,30 35,28 35,25 C 35,21 32,18 28,18 Z" fill="#ef4444"/>
    <rect x="25" y="33" width="6" height="3" fill="#b91c1c" rx="1"/>
    <!-- Rays -->
    <line x1="28" y1="9" x2="28" y2="12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="28" x2="17" y2="28" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="39" y1="28" x2="42" y2="28" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="20" y2="20" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="18" x2="36" y2="20" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <!-- Text -->
    <text x="50" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#0f172a">AICTE - <tspan fill="#ef4444">IDEALab</tspan></text>
  </g>
</svg>
