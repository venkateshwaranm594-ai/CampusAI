<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- NBA Badge -->
  <g transform="translate(10, 10)">
    <!-- NBA Stylized Letters in rounded blue box -->
    <rect x="25" y="5" width="90" height="42" rx="8" fill="#0284c7" />
    <text x="70" y="36" font-family="'Arial Black', Impact, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">NBA</text>
    <text x="70" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#0369a1" text-anchor="middle">NATIONAL BOARD</text>
    <text x="70" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">OF ACCREDITATION</text>
  </g>
